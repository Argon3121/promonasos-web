<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: oformlenie(~{::#soderzhimoe})}">
<body>
<div id="soderzhimoe">

    <nav class="crumbs" aria-label="Хлебные крошки">
        <div class="container">
            <ol>
                <li><a href="/">Главная</a></li>
                <li aria-current="page">Свидетельства официального дилера</li>
            </ol>
        </div>
    </nav>

    <div class="container">
        <div class="page-head">
            <h1>Свидетельства официального дилера</h1>
            <p>На поставку промышленных насосов получены соответствующие лицензии, разрешения и сертификаты официального дилера:</p>
        </div>

        <section class="section sertifikaty-group">
            <h2>Свидетельства дилера и партнёрства</h2>
            <div class="sertifikaty">
                <figure class="sertifikat-card" th:each="s : ${dilerskie}">
                    <a th:href="@{${s.fayl}}" target="_blank" rel="noopener">
                        <img th:src="@{${s.miniatyura}}" th:alt="${s.nazvanie}" loading="lazy"/>
                    </a>
                    <span class="badge" th:text="${s.badge}"></span>
                    <figcaption>
                        <span th:text="${s.nazvanie}"></span>
                        <a class="link-arrow" th:href="@{${s.fayl}}" target="_blank" rel="noopener">Открыть PDF</a>
                    </figcaption>
                </figure>
            </div>

            <h2>Декларации и сертификаты соответствия</h2>
            <div class="sertifikaty">
                <figure class="sertifikat-card" th:each="s : ${sootvetstviya}">
                    <a th:href="@{${s.fayl}}" target="_blank" rel="noopener">
                        <img th:src="@{${s.miniatyura}}" th:alt="${s.nazvanie}" loading="lazy"/>
                    </a>
                    <span class="badge" th:text="${s.badge}"></span>
                    <figcaption>
                        <span th:text="${s.nazvanie}"></span>
                        <a class="link-arrow" th:href="@{${s.fayl}}" target="_blank" rel="noopener">Открыть PDF</a>
                    </figcaption>
                </figure>
            </div>
        </section>
    </div>

    <div th:replace="~{fragments/cta-block :: cta('Нужен оригинал сертификата или официальное письмо для тендера? Пришлите запрос.')}"></div>
</div>
</body>
</html>
