<!DOCTYPE html>
<html lang="ru" th:replace="~{layout :: oformlenie(~{::#soderzhimoe})}">
<body>
<div id="soderzhimoe">

    <nav class="crumbs" aria-label="Хлебные крошки">
        <div class="container">
            <ol>
                <li><a href="/">Главная</a></li>
                <li aria-current="page">Инжиниринг и сервис</li>
            </ol>
        </div>
    </nav>

    <div class="container">
        <div class="page-head">
            <h1>Инжиниринг и сервис</h1>
            <p>
                Оборудование — это половина работы. Вторая половина в том, чтобы оно проработало
                заявленный ресурс: правильный подбор, грамотный монтаж и обученный персонал.
            </p>
        </div>

        <ul class="chips">
            <li th:each="u : ${uslugi}"><a class="chip" th:href="'#' + ${u.slug}" th:text="${u.nazvanie}"></a></li>
        </ul>

        <section class="section usluga" th:each="u : ${uslugi}" th:id="${u.slug}">
            <div class="two-col">
                <div>
                    <h2 th:text="${u.nazvanie}"></h2>
                    <p class="usluga__lead" th:text="${u.kratkoeOpisanie}"></p>
                    <p th:each="abzac : ${u.opisanie}" th:text="${abzac}"></p>
                    <h3>Как это устроено</h3>
                    <ol class="list-steps">
                        <li th:each="e : ${u.etapy}" th:text="${e}"></li>
                    </ol>
                </div>
                <aside class="panel">
                    <h3>Что вы получаете</h3>
                    <ul class="list-check">
                        <li th:each="r : ${u.rezultat}" th:text="${r}"></li>
                    </ul>
                    <a class="btn btn--primary btn--block" href="#zayavka-forma">Обсудить задачу</a>
                </aside>
            </div>
        </section>
    </div>

    <div th:replace="~{fragments/cta-block :: cta('Опишите задачу — предложим услугу и назовём стоимость со сроком.')}"></div>
</div>
</body>
</html>
