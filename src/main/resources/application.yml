server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/xml,text/xml,image/svg+xml

spring:
  application:
    name: promonasos-web
  thymeleaf:
    cache: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  inquiry:
    email-to: ${INQUIRY_EMAIL:info@hermetica.su}
    email-from: ${SMTP_FROM:info@hermetica.su}

# Аналог секции "Sait" из appsettings.json оригинала.
sait:
